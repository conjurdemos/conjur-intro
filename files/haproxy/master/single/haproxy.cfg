global
  daemon
  maxconn 256
  log-send-hostname

resolvers docker
  nameserver dns1 127.0.0.11:53
  resolve_retries 3
  timeout retry 1s
  hold valid 30s
  hold other 30s
  hold refused 30s
  hold nx 30s
  hold timeout 30s

defaults
  mode tcp
  option tcplog
  timeout connect 5000ms
  timeout client  600000ms
  timeout server  600000ms

#
# Perform TCP Pass-Through to proxy HTTPS/TCP requests to DAP
#
frontend dap-frontend
  # mode tcp
  bind *:443
  bind *:1999
  bind *:5432
  bind *:5433

  default_backend dap-backend

backend dap-backend
  balance roundrobin
  server conjur-master-1 conjur-master-1.mycompany.local check port 444 resolvers docker init-addr none

#
# Enables HAProxy's UI for debugging
#
listen stats
  mode http
  bind *:7000
  stats enable
  stats uri /
