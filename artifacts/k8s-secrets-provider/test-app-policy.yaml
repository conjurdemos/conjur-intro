- !host
  id: apps/system:serviceaccount:test-app:test-app-sa
  annotations:
    authn-jwt/dev-cluster-sp/kubernetes.io/namespace: test-app
    authn-jwt/dev-cluster-sp/kubernetes.io/serviceaccount/name: test-app-sa

- !grant
  roles:
    - !group conjur/authn-jwt/dev-cluster-sp/apps
  members:
    - !host apps/system:serviceaccount:test-app:test-app-sa

- !variable db-credentials/url
- !variable db-credentials/username
- !variable db-credentials/password

- !permit 
  roles:
    - !group conjur/authn-jwt/dev-cluster-sp/apps
  privileges: [ read, execute ]
  resources:
    - !variable db-credentials/url
    - !variable db-credentials/username
    - !variable db-credentials/password
