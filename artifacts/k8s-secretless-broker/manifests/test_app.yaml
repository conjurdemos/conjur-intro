apiVersion: v1
kind: ServiceAccount
metadata:
  name: test-app-sa
  namespace: test-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: test-app
  name: test-app
  namespace: test-app
spec:
  selector:
    matchLabels:
      app: test-app
  replicas: 1
  template:
    metadata:
      labels:
        app: test-app
    spec:
      serviceAccountName: test-app-sa
      containers:
        - name: test-app
          image: alpine:latest
          imagePullPolicy: IfNotPresent
          command: [ "/bin/sh", "-c", "--" ]
          args:
            - |
              echo "Waiting for secretless-broker to be ready on localhost:5432..."
              while ! nc -z localhost 5432; do
                echo "secretless-broker not ready yet, retrying in 2s..."
                sleep 2
              done
              echo "secretless-broker is accepting connections on localhost:5432."
              while true; do sleep 30; done

        - name: secretless-broker
          image: cyberark/secretless-broker:latest
          imagePullPolicy: IfNotPresent
          args: [ "-f", "/etc/secretless/secretless.yml" ]
          env:
            - name: JWT_TOKEN_PATH
              value: /var/run/secrets/tokens/jwt
            - name: CONJUR_AUTHN_TOKEN_FILE
              value: /var/run/secrets/tokens/jwt
          envFrom:
            - configMapRef:
                name: conjur-connect
          volumeMounts:
            - name: jwt-token
              mountPath: /var/run/secrets/tokens
            - name: secretless-config
              mountPath: /etc/secretless
              readOnly: true
      volumes:
        - name: jwt-token
          projected:
            sources:
              - serviceAccountToken:
                  path: jwt
                  expirationSeconds: 6000
                  audience: conjur
        - name: secretless-config
          configMap:
            name: secretless-config

