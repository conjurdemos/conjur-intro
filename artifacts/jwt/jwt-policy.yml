# JWT authenticator (authn-jwt/intro) that accepts tokens signed with a key generated by --provision-jwt.
# The public key is stored in the `public-keys` variable, so no token issuer has to run.
- !policy
  id: conjur/authn-jwt/intro
  body:
  - !webservice
    annotations:
      description: Authentication service for JWT tokens signed with a generated key.

  # The JWK set that tokens are verified with: {"type":"jwks","value":{"keys":[...]}}
  - !variable public-keys
  - !variable issuer
  # The claim whose value names the host, below the identity path
  - !variable token-app-property
  - !variable identity-path

  # Hosts in this group may authenticate with a token
  - !group apps

  - !permit
    role: !group apps
    privilege: [ read, authenticate ]
    resource: !webservice

# The host is chosen by the value of the token claim named in `token-app-property` (here `project_id`), looked up under
# the identity path (`jwt-apps`). The host id therefore has to equal the claim value. Every host also needs an annotation
# that names a claim; the authenticator checks the claim against it.
- !policy
  id: jwt-apps
  body:
  - !host
    id: myapp
    annotations:
      authn-jwt/intro/project_id: myapp
  - !host
    id: other
    annotations:
      authn-jwt/intro/project_id: other

- !grant
  role: !group conjur/authn-jwt/intro/apps
  members:
  - !host jwt-apps/myapp
  - !host jwt-apps/other

- !variable jwt-secret

# Only myapp may read the secret
- !permit
  role: !host jwt-apps/myapp
  privilege: [ read, execute ]
  resource: !variable jwt-secret
