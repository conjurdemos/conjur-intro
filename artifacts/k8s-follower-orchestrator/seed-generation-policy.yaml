# =================================================
# == Register the seed generation service
# =================================================
- !policy
  id: conjur/seed-generation
  body:
    # This webservice represents the Seed service API
    - !webservice

    # Hosts that can generate seeds become members of the
    # `consumers` group.
    - !group consumers

    # Authorize `consumers` to request seeds
    - !permit
      role: !group consumers
      privilege: [ "execute" ]
      resource: !webservice

    # =================================================
    # == Plaintext Follower Seed Service (Conjur 13.8.1+)
    # =================================================
    - !policy
      id: follower
      body:
        - !policy
          id: plaintext
          body:
            - !webservice

            - !group consumers

            - !permit
              role: !group consumers
              privilege: [ "execute" ]
              resource: !webservice
