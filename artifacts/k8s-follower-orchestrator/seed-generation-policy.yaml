---
# =================================================
# == Register the seed generation service
# =================================================
- !policy
  id: conjur/seed-generation
  body:
    # This webservice represents the Seed service API
    - !webservice

      # Hosts that can generate seeds become members of the
    # `consumers` group.
    - !group consumers

    # Authorize `consumers` to request seeds
    - !permit
      role: !group consumers
      privilege: [ "execute" ]
      resource: !webservice

    # =================================================
    # == Authorize plaintext follower seed retrieval
    # =================================================
    # Conjur 13.8.1 added a second authorization check on plaintext seed
    # retrieval. The seed service is not new, but requesting a plaintext
    # seed now also requires `execute` on this webservice, so policy that
    # was sufficient in earlier releases no longer is.
    - !policy
      id: follower
      body:
        - !policy
          id: plaintext
          body:
            - !webservice

            - !group consumers

            - !permit
              role: !group consumers
              privilege: [ "execute" ]
              resource: !webservice
